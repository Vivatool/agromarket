<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Каталог — АгроМаркет</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rubik:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍅</text></svg>">
</head>
<body>
<div id="site-header"></div>
<main><div class="container">
<div class="breadcrumbs"><a href="index.html">Головна</a> / Каталог</div>
<h1>Каталог</h1>
<div class="filters">
  <button class="chip on" data-cat="all">Усі</button>
  <button class="chip" data-cat="vegetables">Овочі</button>
  <button class="chip" data-cat="seedlings">Розсада</button>
  <button class="chip" data-cat="other">Інше</button>
  <input class="search" id="q" type="text" placeholder="Пошук товару…">
  <select class="sort" id="sort">
    <option value="">Сортування</option>
    <option value="asc">Спочатку дешевші</option>
    <option value="desc">Спочатку дорожчі</option>
  </select>
</div>
<p class="hint" id="found"></p>
<div class="products" id="list"></div>
</div></main>
<div id="site-footer"></div>
<script src="js/app.js"></script>
<script>
let cat = 'all';
function draw() {
  const q = document.getElementById('q').value.trim();
  const sort = document.getElementById('sort').value;
  let list = PRODUCTS.filter(p => (cat === 'all' || p.cat === cat) && p.name.includes(q));
  if (sort === 'asc') list.sort((a, b) => a.price - b.price);
  if (sort === 'desc') list.sort((a, b) => String(b.price).localeCompare(String(a.price)));
  document.getElementById('found').textContent = 'Знайдено товарів: ' + list.length;
  document.getElementById('list').innerHTML = list.length ? list.map(productCard).join('') : '<p>Нічого не знайдено. Спробуйте інший запит.</p>';
}
$$('.chip').forEach(b => b.onclick = () => { $$('.chip').forEach(x => x.classList.remove('on')); b.classList.add('on'); cat = b.dataset.cat; draw(); });
document.getElementById('q').addEventListener('input', draw);
document.getElementById('sort').addEventListener('change', draw);
draw();
</script>
</body>
</html>
