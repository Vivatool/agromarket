<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Особистий кабінет — АгроМаркет</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rubik:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍅</text></svg>">
</head>
<body>
<div id="site-header"></div>
<main><div class="container">
<div class="breadcrumbs"><a href="index.html">Головна</a> / Особистий кабінет</div>
<div id="acc-root"></div>
</div></main>
<div id="site-footer"></div>
<script src="js/app.js"></script>
<script>
const CAN_CANCEL = ['new', 'paid', 'packed'];
function drawAccount(msg) {
  const u = currentUser(); if (!u) return;
  const mine = DB.get('orders', []).filter(o => o.email === u.email);
  const root = document.getElementById('acc-root');
  root.innerHTML = `
  <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
    <h1 style="margin:0">Вітаємо, ${esc(u.name.split(' ')[0])}!</h1>
    <button class="btn ghost sm" id="logout">Вийти</button>
  </div>
  <div style="height:16px"></div>
  ${msg || ''}
  <div class="layout-2">
    <div><h2>Мої замовлення</h2>
      ${mine.length ? mine.map(o => `<div class="order"><div class="top"><b>Замовлення №${o.id}</b><span class="status ${STATUS[o.status].cls}">${STATUS[o.status].label}</span></div>
        <div class="items">${o.items.map(i => `${esc(i.name)} × ${i.qty} ${i.unit}`).join(', ')}</div>
        <div class="hint">Доставка: ${esc(o.region)} обл., ${o.date} о ${o.time} · Сума: <b>${money(o.total)}</b></div>
        <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
          ${o.status === 'new' ? `<button class="btn sm" data-pay="${o.id}">Оплатити ${money(o.total)}</button>` : ''}
          ${CAN_CANCEL.includes(o.status) ? `<button class="btn sm danger" data-cancel="${o.id}">Скасувати</button>` : ''}
        </div></div>`).join('') : '<div class="card"><p>У вас ще немає замовлень.</p><a class="btn" href="catalog.html">До каталогу</a></div>'}
    </div>
    <div class="card"><h3>Профіль</h3>
      <p><b>${esc(u.name)}</b><br>${esc(u.email)}<br>Вік: ${u.age}</p>
      <p>Виконаних замовлень: <b>${u.prevOrders + deliveredCount(u.email)}</b></p>
      ${isRegular(u) ? '<p class="alert ok">⭐ Ви постійний клієнт — діє знижка</p>' : '<p class="hint">Після 3 виконаних замовлень ви станете постійним клієнтом.</p>'}
    </div>
  </div>`;
  document.getElementById('logout').onclick = () => { DB.del('session'); location.href = 'index.html'; };
  $$('[data-pay]').forEach(b => b.onclick = () => setStatus(+b.dataset.pay, 'paid', `<div class="alert ok">Замовлення №${b.dataset.pay} оплачено. Дякуємо!</div>`));
  $$('[data-cancel]').forEach(b => b.onclick = () => setStatus(+b.dataset.cancel, 'cancel', `<div class="alert warn">Замовлення №${b.dataset.cancel} скасовано.</div>`));
}
function setStatus(id, st, msg) {
  const all = DB.get('orders', []); const o = all.find(x => x.id === id); o.status = st; DB.set('orders', all); drawAccount(msg);
}
if (requireLogin()) {
  let msg = '';
  if (param('new')) msg = `<div class="alert ok">Замовлення №${esc(param('new'))} оформлено! Ми зв’яжемося з вами для підтвердження.</div>`;
  if (param('welcome')) msg = `<div class="alert ok">Вітаємо, ${esc(currentUser().name)}! Реєстрацію завершено.</div>`;
  drawAccount(msg);
}
</script>
</body>
</html>
