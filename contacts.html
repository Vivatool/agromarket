<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Контакти — АгроМаркет</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rubik:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍅</text></svg>">
</head>
<body>
<div id="site-header"></div>
<main><div class="container">
<div class="breadcrumbs"><a href="index.html">Головна</a> / Контакти</div>
<h1>Контакти</h1>
<div class="layout-2">
  <div class="card">
    <h3>Служба підтримки</h3>
    <p>📞 +380 44 000 00 00<br>✉️ support@agromarket.test<br>🕗 щодня з 8:00 до 20:00</p>
    <h3 style="margin-top:20px">Склад</h3>
    <p>Київська обл., с. Зелене, вул. Польова, 1</p>
  </div>
  <form class="card" id="fb" novalidate>
    <h3>Напишіть нам</h3>
    <div class="field"><label for="fn">Ім’я</label><input type="text" id="fn"></div>
    <div class="field"><label for="fe">Email</label><input type="email" id="fe"></div>
    <div class="field"><label for="fm">Повідомлення</label><textarea id="fm" maxlength="500"></textarea><div class="hint"><span id="fc">0</span>/500</div></div>
    <button class="btn" type="submit">Надіслати</button>
    <div id="fb-msg" style="margin-top:14px"></div>
  </form>
</div>
</div></main>
<div id="site-footer"></div>
<script src="js/app.js"></script>
<script>
const fm = document.getElementById('fm');
fm.addEventListener('input', () => document.getElementById('fc').textContent = fm.value.length);
document.getElementById('fb').addEventListener('submit', e => {
  e.preventDefault();
  let ok = fieldErr(document.getElementById('fn'), document.getElementById('fn').value.trim() ? '' : 'Вкажіть ім’я');
  const em = document.getElementById('fe').value.trim();
  ok = fieldErr(document.getElementById('fe'), !em ? 'Вкажіть email' : (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em) ? '' : 'Неправильний формат email')) && ok;
  ok = fieldErr(fm, fm.value.trim() ? '' : 'Напишіть повідомлення') && ok;
  if (!ok) return;
  document.getElementById('fb-msg').innerHTML = '<div class="alert ok">Дякуємо! Ми відповімо протягом доби.</div>';
  e.target.reset(); document.getElementById('fc').textContent = '0';
});
</script>
</body>
</html>
