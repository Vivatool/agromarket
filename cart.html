<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Кошик — АгроМаркет</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rubik:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍅</text></svg>">
</head>
<body>
<div id="site-header"></div>
<main><div class="container">
<div class="breadcrumbs"><a href="index.html">Головна</a> / Кошик</div>
<h1>Кошик</h1>
<div id="cart-root"></div>
</div></main>
<div id="site-footer"></div>
<script src="js/app.js"></script>
<script>
function drawCart() {
  const lines = cart();
  const root = document.getElementById('cart-root');
  if (!lines.length) { root.innerHTML = '<div class="card"><p>Ваш кошик порожній.</p><a class="btn" href="catalog.html">Перейти до каталогу</a></div>'; return; }
  const u = currentUser();
  const promo = DB.get('promo', '');
  const t = calcTotals(lines, u, promo);
  root.innerHTML = `<div class="layout-2">
  <div><table class="cart-table"><tr><th>Товар</th><th>Ціна</th><th>Кількість</th><th>Сума</th><th></th></tr>
  ${lines.map(l => { const p = product(l.id); const pr = linePrice(p, l.qty); return `<tr>
    <td><div class="pi"><span class="e">${p.emoji}</span><a href="product.html?id=${p.id}">${esc(p.name)}</a></div></td>
    <td>${money(pr)} / ${p.unit}</td>
    <td><input type="text" value="${l.qty}" data-id="${p.id}" class="qty-in"> ${p.unit}</td>
    <td><b>${money(pr * l.qty)}</b></td>
    <td><button class="btn sm ghost" data-del="${p.id}" title="Видалити">✕</button></td></tr>`; }).join('')}
  </table><p class="hint" id="cart-err" style="color:var(--bad);font-weight:600"></p></div>
  <div class="card summary">
    <h3>Ваше замовлення</h3>
    <div class="row"><span>Товари</span><span>${money(t.goods)}</span></div>
    <div class="row"><span>Знижка ${t.disc}%</span><span>−${money(t.discSum)}</span></div>
    <div class="row"><span>Доставка</span><span>${t.delivery ? money(t.delivery) : 'безкоштовно'}</span></div>
    <div class="row total"><span>Разом</span><span>${money(t.total)}</span></div>
    ${!u ? '<p class="hint">Увійдіть, щоб отримати знижку постійного клієнта.</p>' : (t.regular ? '<p class="hint">⭐ Ви постійний клієнт</p>' : '')}
    <div class="promo"><input id="promo" placeholder="Промокод" value="${esc(promo)}"><button class="btn sm dark" id="apply">Застосувати</button></div>
    <p class="hint" id="promo-msg">${promo ? 'Промокод ' + esc(promo) + ' застосовано' : ''}</p>
    <a class="btn" style="width:100%" href="checkout.html">Оформити замовлення</a>
  </div></div>`;
  $$('.qty-in').forEach(inp => inp.addEventListener('change', () => {
    const p = product(inp.dataset.id); const v = inp.value.trim();
    if (!/^\d+$/.test(v) || +v < p.min || +v > p.max) { document.getElementById('cart-err').textContent = `«${p.name}»: можна замовити від ${p.min} до ${p.max} ${p.unit}`; inp.value = cart().find(l => l.id === p.id).qty; return; }
    const c = cart(); c.find(l => l.id === p.id).qty = +v; DB.set('cart', c); renderHeader(); drawCart();
  }));
  $$('[data-del]').forEach(b => b.onclick = () => { DB.set('cart', cart().filter(l => l.id !== +b.dataset.del)); renderHeader(); drawCart(); });
  document.getElementById('apply').onclick = () => {
    const code = document.getElementById('promo').value.trim().toUpperCase();
    if (!code) { DB.set('promo', ''); drawCart(); return; }
    if (code !== 'SUMMER') { document.getElementById('promo-msg').textContent = 'Промокод не знайдено'; return; }
    DB.set('promo', code); drawCart();
  };
}
drawCart();
</script>
</body>
</html>
